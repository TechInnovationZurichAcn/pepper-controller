<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;height:100%;background:#000;}
body{text-align:center;}
/* full-screen centered gif; table-cell centering works on old WebViews */
#wrap{display:table;width:100%;height:100%;}
#cell{display:table-cell;vertical-align:middle;text-align:center;}
img{max-width:100%;max-height:100%;}
</style>
</head>
<body>
<div id="wrap"><div id="cell">
<img src="67.gif" alt="67">
</div></div>
</body>
</html>
